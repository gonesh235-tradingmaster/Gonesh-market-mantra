<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Market News Intelligence</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: #f5f7ff;
}

header {
    padding: 20px;
    border-bottom: 1px solid #252b42;
    background: #10162a;
}

h1 {
    margin: 0;
    font-size: 24px;
}

.subtitle {
    margin-top: 6px;
    color: #8e97b5;
    font-size: 13px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.status {
    background: #121a31;
    border: 1px solid #28304b;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.status span {
    color: #65e6a5;
    font-weight: bold;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
}

.card {
    background: #121a31;
    border: 1px solid #28304b;
    border-radius: 12px;
    padding: 18px;
}

.card h2 {
    margin-top: 0;
    font-size: 17px;
}

.article {
    border-top: 1px solid #252d47;
    padding-top: 14px;
    margin-top: 14px;
}

.title {
    font-weight: bold;
    line-height: 1.4;
}

.meta {
    color: #8993b2;
    font-size: 12px;
    margin-top: 6px;
}

.summary {
    color: #c9cee0;
    font-size: 13px;
    line-height: 1.5;
    margin-top: 10px;
}

.impact {
    margin-top: 10px;
    font-size: 13px;
}

.badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 6px;
    background: #242d49;
    font-size: 11px;
    margin-right: 5px;
}

a {
    color: #7eb6ff;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

footer {
    text-align: center;
    color: #737c99;
    padding: 30px;
    font-size: 12px;
}

</style>
</head>
